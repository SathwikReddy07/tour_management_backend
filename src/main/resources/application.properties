spring.application.name=backend

#Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tms_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Cloudinary Configuration
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=

#Jwt Configuration
jwt.secret-key=

#Admin Configuration
admin.name=
admin.email=
admin.phone=
admin.password=

#Razorpay Configuration
razorpay.key-id=
razorpay.key-secret=

#Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.scope[0]=openid
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.registration.google.scope[2]=email